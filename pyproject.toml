[project]
name = "uv-upx"
version = "0.5.0"

description = "Upgrade versions of dependencies in pyproject.toml files in uv-managed projects."
readme = "README.remotified.md"
keywords = ["uv", "upgrade", "dependencies", "pyproject.toml", "automation", "cli"]

license_files = ["LICENSE.txt"]

authors = [
    { name = "Alirex", email = "alirex.prime@gmail.com" }
]

requires-python = ">=3.14.2"
dependencies = [
    # Better classes and data validation
    "pydantic>=2.12.5",
    # TOML parser and writer with preserved formatting
    "tomlkit>=0.13.3",
    # CLI app framework
    "typer>=0.21.1",
    # CLI interactive features
    "prompt-toolkit>=3.0.52",
    # Rust-like result type for Python.
    "safe-result>=4.0.3",
]

[project.urls]
Homepage = "https://github.com/Alirex/uv_upgrade"
Repository = "https://github.com/Alirex/uv_upgrade"
Documentation = "https://github.com/Alirex/uv_upgrade"
Issues = "https://github.com/Alirex/uv_upgrade/issues"


[dependency-groups]
dev = [
    # [typing]-[BEGIN]
    # Static type checker
    "mypy>=1.19.1",
    # [typing]-[END]
    # [testing]-[BEGIN]
    "pytest>=9.0.2",
    "pytest-benchmark>=5.2.3",
    # Coverage gate
    "pytest-cov>=7.0.0",
    # [testing]-[END]
    # Extra checker. Used by Zed.
    "basedpyright>=1.37.1",
    # Linter and formatter (also a prek hook; here for `uv run ruff` and the poe tasks)
    "ruff>=0.17.2",
    # Task runner
    "poethepoet>=0.40.0",
    # Dead code checker
    "vulture>=2.14",
    # Code complexity checker
    "radon>=6.0.1",
    # Generate a Markdown file with better compatibility with PyPI
    "mdremotifier>=1.0.0",
]

[project.scripts]
# For simplicity.
uv-upgrade = "uv_upx:main_short"
# For compatibility with uvx.
uv-upx = "uv_upx:main"

[build-system]
requires = ["uv_build>=0.9.15,<0.10.0"]
build-backend = "uv_build"

[tool.poe.tasks]
pca = [
    { cmd = "prek run --all-files" },
]

# Run with: poe metrics or uv run poe metrics
# Check code quality: dead code, complexity, and maintainability
metrics = [
    { cmd = "vulture . --min-confidence 80 --exclude .venv,build,dist,docs,scripts,tests" },
    { cmd = "radon cc . -a -nb" },
    { cmd = "radon mi . -nb" }
]

# Run with: poe quality or uv run poe quality
# Full quality check: format, lint, type check, and metrics
quality = [
    { cmd = "ruff format ." },
    { cmd = "ruff check . --fix" },
    { cmd = "basedpyright --level error" },
    { cmd = "vulture . --min-confidence 80 --exclude .venv,build,dist,docs,scripts,tests" },
    { cmd = "radon cc . -a -nb" }
]


[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=uv_upx --cov-report=term-missing:skip-covered"
xfail_strict = true
# Warnings are errors: a deprecation is fixed when it appears, not when the API is gone.
filterwarnings = ["error"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
# Never lower it to pass; raise it when the coverage grows.
fail_under = 84

[tool.mypy]
plugins = [
    "pydantic.mypy",
]

strict = true
# A `type: ignore` must name the error code.
enable_error_code = ["ignore-without-code"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.ruff]
line-length = 120
fix = true
show-fixes = true

extend-exclude = [
]

[tool.ruff.lint]
extend-select = [
    "ALL",
]
extend-ignore = [
    # D1: Missing docstring. Names and types describe most of the code; 160+ places would need filler text.
    "D1",
    # FLY002: Consider an f-string instead of `str.join`. Long messages are built with `join` on purpose
    # (explicit concatenation: implicit one is banned by basedpyright, `+` by ISC003).
    "FLY002",
    # TD002, TD003: TODO needs an author and an issue link. TODOs are free-form notes of the maintainer.
    "TD002",
    "TD003",
    # FIX: Line contains a TODO or related comment. TODOs are allowed as notes.
    "FIX",
    # PLR2044: Empty comment. A bare "#" separates groups of arguments, the formatter keeps them.
    "PLR2044",
    # CPY001: Missing copyright notice in a file (the license is in LICENSE.txt).
    "CPY001",
    # T201: `print` used. It is the output of the CLI (stdout), the logging goes to `logging`.
    "T201",
]

task-tags = [
    "TODO",
    "FIXME",
    "HACK",
    "XXX",
    "[",
]

[tool.ruff.lint.pydocstyle]
convention = "google"
# https://betterprogramming.pub/3-different-docstring-formats-for-python-d27be81e0d68

[tool.ruff.lint.flake8-comprehensions]
allow-dict-calls-with-keyword-arguments = true


[tool.ruff.lint.extend-per-file-ignores]
"__init__.py" = [
    # Unused import.
    "F401",
]

"src/uv_upx/cli/**/main.py" = [
    # Typer reads the annotations of the commands at runtime, so `pathlib` must be imported at runtime.
    "TC003",
]

"test_*.py" = [
    # Allow `assert` statements in tests.
    "S101",
]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
]
runtime-evaluated-decorators = [
    "pydantic.validate_call",
    "app.command",
]

[tool.basedpyright]
typeCheckingMode = "all"
failOnWarnings = true

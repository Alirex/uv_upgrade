exclude: |
  (?x)^(
    \.idea/.*|
    docs_extra/cli_help_simple.md|
    docs_extra/cli_help_advanced.md|
    README.remotified.md
    )$

repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.9.24
    hooks:
      - id: uv-lock

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
        # Check for files that contain merge conflict strings.
      - id: trailing-whitespace
        # Trims trailing whitespace.
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
        # Makes sure files end in a newline and only a newline.
        # Exclude some autogenerated files.
      - id: check-yaml
        # Checks that your YAML files are parseable.
      - id: check-toml
        # Attempts to load all TOML files to verify syntax.
      - id: check-json
        # Checks that all JSON files are parseable.
      - id: check-added-large-files
        # Prevent giant files from being committed.
        args: [--maxkb=500]

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck

  - repo: https://gitlab.com/vojko.pribudic.foss/pre-commit-update
    # https://pypi.org/project/pre-commit-update/
    rev: v0.9.0
    hooks:
      - id: pre-commit-update

  - repo: https://github.com/JoC0de/pre-commit-prettier
    rev: v3.7.4
    hooks:
      - id: prettier
        files: \.(json|ya?ml|md)$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.14.11
    hooks:
      - id: ruff-check
        # Run the linter.
        args: [--fix, --unsafe-fixes]
      - id: ruff-format
        # Run the formatter.

  - repo: local
    # Hooks with local scripts.
    hooks:
      # Rust hooks. Possible examples:
      # https://github.com/j178/prefligit/blob/master/.pre-commit-config.yaml
      - id: rust-clippy
        name: Rust clippy
        description: Run cargo clippy on files included in the commit.
        # Installed with rustup
        # https://rust-lang.github.io/rustup/concepts/components.html

        # Rules groups: https://doc.rust-lang.org/clippy/index.html
        # Levels: https://doc.rust-lang.org/rustc/lints/levels.html
        # Command example: https://doc.rust-lang.org/clippy/continuous_integration/travis.html

        # Note: used options from "cargo check" command for targets/packages
        # https://doc.rust-lang.org/cargo/commands/cargo-check.html

        # entry: cargo clippy --all-targets --all-features --fix --allow-dirty -- -D clippy::all

        # "-D": A 'deny' lint produces an error if you violate it
        # "-D clippy::all": Enable all lints (Deny to violate for all rules)
        # "--all-targets": Check all targets (default: the package and its dependencies) (don't use during rustcamp)
        # "--all-features": Check all available features
        # "--fix": Automatically apply suggestions
        # "--allow-dirty": For run also on non-committed files
        # "--allow-staged": For run also on staged files
        entry: cargo clippy --all-features --fix --allow-dirty --allow-staged --
          -D clippy::all
        pass_filenames: false
        types: [ file, rust ]
        language: system

      - id: rust-format
        # Note: Run after linter, because it can change the file.
        name: Rust format
        description: Run cargo fmt on files included in the commit.
        # Installed with rustup
        # https://rust-lang.github.io/rustup/concepts/components.html

        # Command example: https://github.com/rust-lang/rustfmt?tab=readme-ov-file#checking-style-on-a-ci-server

        # "--all": Format all files in the workspace
        entry: cargo fmt --
        pass_filenames: true
        types: [ file, rust ]
        language: system

      - id: rust-build
        # Note: Run after linter and formatter, because it can change the file.
        name: Rust build
        description: Run cargo build on files included in the commit.
        # Installed with rustup
        # https://rust-lang.github.io/rustup/concepts/components.html

        # Command example: https://doc.rust-lang.org/cargo/commands/cargo-build.html

        # "--all": Build all packages in the workspace
        entry: cargo build --
        types: [ file, rust ]
        pass_filenames: false
        language: system

      - id: rust-cli-doc
        name: Rust CLI doc
        description: Generate markdown documentation for CLI applications.
        entry: cargo run -- cli-helpers export-cli-help --output docs_extra/cli_help_advanced.md
        types: [ file, rust ]
        pass_filenames: false
        language: system


      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false

#      - id: generate-cli-help-simple
#        # Generate CLI help.
#        name: generate-cli-help-simple
#        entry: uv run typer uv_upx.cli.upgrade.main utils docs --output
#          docs_extra/cli_help_simple.md
#        language: system
#        pass_filenames: false
#
#      - id: generate-cli-help-advanced
#        # Generate CLI help.
#        name: generate-cli-help-advanced
#        entry: uv run typer uv_upx.cli.main utils docs --output
#          docs_extra/cli_help_advanced.md
#        language: system
#        pass_filenames: false

      - id: basedpyright
        # Check Python code style.
        name: basedpyright
        entry: uv run basedpyright
        language: system
        types: [python]
        pass_filenames: false
        # hook will execute using a single process instead of in parallel
        require_serial: true

      - id: mypy
        # Static type checker for Python.
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        # hook will execute using a single process instead of in parallel
        require_serial: true

      - id: app-check
        #
        name: app-check
        entry: uv run uv-upgrade --help
        language: system
        pass_filenames: false
        # hook will execute using a single process instead of in parallel
        require_serial: true

      - id: mdremotifier
        #
        name: mdremotifier
        entry: uv run mdremotifier --input README.md --output
          README.remotified.md --url-prefix
          https://github.com/Alirex/uv_upgrade/blob/main/ --img-url-prefix
          https://raw.githubusercontent.com/Alirex/uv_upgrade/main/
        language: system
        pass_filenames: false
        # hook will execute using a single process instead of in parallel
        require_serial: true

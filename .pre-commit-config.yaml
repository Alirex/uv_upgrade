exclude: |
  (?x)^(
    \.idea/.*|
    docs_extra/cli_help_simple.md|
    docs_extra/cli_help_advanced.md|
    README.remotified.md
    )$

# Cheap fixers and linters run on commit; basedpyright runs on push (`just dev-hooks` installs both).
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.5
    hooks:
      - id: uv-lock

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
        # Check for files that contain merge conflict strings.
      - id: trailing-whitespace
        # Trims trailing whitespace.
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
        # Makes sure files end in a newline and only a newline.
        # Exclude some autogenerated files.
      - id: check-yaml
        # Checks that your YAML files are parseable.
      - id: check-toml
        # Attempts to load all TOML files to verify syntax.
      - id: check-json
        # Checks that all JSON files are parseable.
      - id: check-added-large-files
        # Prevent giant files from being committed.
        args: [--maxkb=1024]
      - id: check-executables-have-shebangs
        # Executable files start with #!.
      - id: check-shebang-scripts-are-executable
        # Files with #! have the executable bit.

  - repo: https://github.com/shellcheck-py/shellcheck-py
    # Ships the shellcheck binary as a wheel, so no system install or Docker is needed.
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/igorshubovych/markdownlint-cli
    # Structural checks only; the rules are configured in .markdownlint.yaml.
    rev: v0.50.0
    hooks:
      - id: markdownlint

  - repo: https://github.com/Alirex/pre-commit-just
    # Justfile formatter.
    rev: v0.2.1
    hooks:
      - id: format-justfile

  - repo: https://gitlab.com/vojko.pribudic.foss/pre-commit-update
    # https://pypi.org/project/pre-commit-update/
    rev: v0.10.0
    hooks:
      - id: pre-commit-update

  - repo: https://github.com/JoC0de/pre-commit-prettier
    rev: v3.9.10
    hooks:
      - id: prettier
        files: \.(json|ya?ml|md)$

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    # Workflow security: unpinned actions, excess permissions, template injection.
    rev: v1.31.1
    hooks:
      - id: zizmor

  - repo: https://github.com/gitleaks/gitleaks
    # Secret scanning of the staged changes on every commit (prek builds the Go binary itself).
    # Whole-history scan: `just q-secrets` (the manual-stage twin below).
    rev: v8.30.1
    hooks:
      - id: gitleaks
        # Fails on a leaked key or token. Never allowlist a real secret: rotate it, then rewrite the history.
      - id: gitleaks
        alias: gitleaks-history
        name: gitleaks (whole history)
        entry: gitleaks git --redact --verbose
        stages: [manual]
        always_run: true

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.17.2
    hooks:
      - id: ruff-check
        # Run the linter.
        # Unsafe fixes stay out of the hooks: `just q-lint` runs them by hand.
        args: [--fix]
      - id: ruff-format
        # Run the formatter.

  - repo: local
    # Hooks with local scripts.
    hooks:
      - id: generate-cli-help-simple
        # Generate CLI help.
        name: generate-cli-help-simple
        entry: uv run typer uv_upx.cli.upgrade.main utils docs --output
          docs_extra/cli_help_simple.md
        language: system
        pass_filenames: false

      - id: generate-cli-help-advanced
        # Generate CLI help.
        name: generate-cli-help-advanced
        entry: uv run typer uv_upx.cli.main utils docs --output
          docs_extra/cli_help_advanced.md
        language: system
        pass_filenames: false

      - id: basedpyright
        # Type check (slow): on push; `just q-check` runs it directly.
        name: basedpyright
        stages: [pre-push]
        entry: uv run basedpyright
        language: system
        types: [python]
        pass_filenames: false
        # hook will execute using a single process instead of in parallel
        require_serial: true

      - id: app-check
        #
        name: app-check
        entry: uv run uv-upgrade --help
        language: system
        pass_filenames: false
        # hook will execute using a single process instead of in parallel
        require_serial: true

      - id: mdremotifier
        #
        name: mdremotifier
        entry: uv run mdremotifier --input README.md --output
          README.remotified.md --url-prefix
          https://github.com/Alirex/uv_upgrade/blob/main/ --img-url-prefix
          https://raw.githubusercontent.com/Alirex/uv_upgrade/main/
        language: system
        pass_filenames: false
        # hook will execute using a single process instead of in parallel
        require_serial: true

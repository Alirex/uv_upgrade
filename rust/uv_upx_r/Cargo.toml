[package]
name = "uv-upx-r"
version = "0.1.0"

edition = "2024"
rust-version = "1.93.0"

default-run = "uv-upx"

[dependencies]
# [utils]-[BEGIN]
# For editing TOML files
toml_edit = { version = "0.24.0", features = ["serde"] }
# For showing paths as URIs
path_as_uri = "0.1.0"
# Get the application root folder.
app_root_folder = "0.1.0"
# [utils]-[END]
#
# [logging]-[BEGIN]
tracing-subscriber = "0.3.22"
tracing = "0.1.44"
tracing-appender = "0.2.4"
# [logging]-[END]
#
# [async]-[BEGIN]
tokio = { version = "1.49.0", features = ["full"] }
# [async]-[END]
#
# [cli]-[BEGIN]
clap = { version = "4.5.57", features = ["derive"] }
clap-cargo = "0.15.2"
clap-markdown = "0.1.5"
clap_complete_command = "0.6.1"
# [cli]-[END]
#
# [cli_interactive]-[BEGIN]
# Interactive prompts.
#   For select dialogs.
inquire = "0.9.2"
# [cli_interactive]-[END]
#
# [regex]-[BEGIN]
lazy-regex = "3.5.1"
regex = "1.12.3"
# [regex]-[END]
#
# [tests]-[BEGIN]
# Better tests
rstest = "0.26.1"
# [tests]-[END]
#
# [errors]-[BEGIN]
# For error handling
anyhow = "1.0.100"
# For better error types
thiserror = "2.0.18"
# [errors]-[END]
#
# [processes]-[BEGIN]
# For running async processes
async-process = "2.5.0"
# [processes]-[END]


[[bin]]
name = "uv-upx"
path = "src/bin/uv_upx.rs"

[[bin]]
name = "uv-upgrade"
path = "src/bin/uv_upgrade.rs"

